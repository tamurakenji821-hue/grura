<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>グルラ - チャット</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1f1f1f; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #333; }
    #room-select { padding: 20px; display: flex; flex-direction: column; gap: 10px; max-width: 400px; margin: auto; width: 100%; }
    input, button { padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 1rem; }
    button { background: #ff4757; font-weight: bold; border: none; cursor: pointer; }
    button:active { opacity: 0.8; }
    #chat-screen { display: none; flex-direction: column; height: 100vh; }
    #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .msg { background: #222; padding: 10px 14px; border-radius: 12px; max-width: 80%; width: fit-content; word-break: break-all; }
    .msg.mine { background: #ff4757; align-self: flex-end; }
    .msg .sender { font-size: 0.75rem; color: #aaa; margin-bottom: 4px; }
    #input-area { padding: 10px; background: #1f1f1f; display: flex; gap: 8px; }
    #input-area input { flex: 1; }
  </style>
</head>
<body>

  <!-- 部屋番号入力画面 -->
  <div id="room-select">
    <h2 style="text-align: center; margin-bottom: 10px;">グルラ チャット</h2>
    <input type="text" id="username" placeholder="名前を入力">
    <input type="text" id="room-code" placeholder="部屋コード (例: 1234)">
    <button onclick="joinRoom()">部屋に入る</button>
  </div>

  <!-- チャット画面 -->
  <div id="chat-screen">
    <header id="room-title">部屋: ----</header>
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="msg-input" placeholder="メッセージを入力...">
      <button onclick="sendMessage()">送信</button>
    </div>
  </div>

  <!-- Firebase SDK の読み込み -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebaseの設定（あなたのプロジェクト鍵）
    const firebaseConfig = {
      apiKey: "AIzaSyD5Lep7EXk3EHjtWu1RqZDCl42PgD_B96E",
      authDomain: "guru-c1809.firebaseapp.com",
      projectId: "guru-c1809",
      storageBucket: "guru-c1809.firebasestorage.app",
      messagingSenderId: "595461719424",
      appId: "1:595461719424:web:1faf912f6798b82626ad65",
      measurementId: "G-Q7LZNM7PTQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentRoom = "";
    let myName = "";

    window.joinRoom = function() {
      const nameInput = document.getElementById("username").value.trim();
      const roomInput = document.getElementById("room-code").value.trim();

      if (!nameInput || !roomInput) {
        alert("名前と部屋コードを入力してください！");
        return;
      }

      myName = nameInput;
      currentRoom = roomInput;

      document.getElementById("room-select").style.display = "none";
      document.getElementById("chat-screen").style.display = "flex";
      document.getElementById("room-title").innerText = `部屋: ${currentRoom}`;

      // リアルタイムでメッセージを受信
      const q = query(collection(db, "rooms", currentRoom, "messages"), orderBy("createdAt", "asc"));
      onSnapshot(q, (snapshot) => {
        const msgContainer = document.getElementById("messages");
        msgContainer.innerHTML = "";
        snapshot.forEach((doc) => {
          const data = doc.data();
          const div = document.createElement("div");
          const isMine = data.sender === myName;
          div.className = `msg ${isMine ? 'mine' : ''}`;
          div.innerHTML = `<div class="sender">${data.sender}</div><div>${data.text}</div>`;
          msgContainer.appendChild(div);
        });
        msgContainer.scrollTop = msgContainer.scrollHeight;
      });
    };

    window.sendMessage = async function() {
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";

      // Firestoreに送信
      await addDoc(collection(db, "rooms", currentRoom, "messages"), {
        text: text,
        sender: myName,
        createdAt: serverTimestamp()
      });
    };
  </script>
</body>
</html>
